AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  retrain-trigger cost guard: monthly AWS Budget on tag project=retrain-trigger (notifications only, which AWS
  does not charge for). Long-lived: deploy once before the other stacks and keep it when they are torn down.

Parameters:
  BudgetUsd:
    Type: Number
    Default: 5
  AlertEmail:
    Type: String
    Description: Where budget alerts go (deploy_cost.sh passes $ALERT_EMAIL; kept out of the repo).

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: retrain-trigger-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetUsd, Unit: USD }
        CostFilters:
          TagKeyValue: ["user:project$retrain-trigger"]
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100 }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
