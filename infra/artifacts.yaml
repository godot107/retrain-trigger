AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  retrain-trigger code bucket: holds the Lambda zip. Private, encrypted, and old objects expire (Lambda keeps
  its own copy of the code once deployed). Emptied and deleted by deploy/down.sh --all.

Resources:
  CodeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-code
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

Outputs:
  BucketName: { Value: !Ref CodeBucket }
